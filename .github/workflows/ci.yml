name: CI

# When to run this workflow
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Job 1: run the test suite ──────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache downloaded packages so repeat runs are faster.
      # The cache is invalidated when requirements.txt changes.
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install system dependencies
        run: sudo apt-get install -y --no-install-recommends libgeos-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  # ── Job 2: build the Docker image ─────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: test                          # only runs if the test job passes
    if: github.ref == 'refs/heads/main'  # only on pushes to main, not PRs

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false          # builds locally to verify — add push: true + registry login to deploy
          tags: geointel-rag:latest
          cache-from: type=gha  # reuse GitHub's build cache between runs
          cache-to: type=gha,mode=max
