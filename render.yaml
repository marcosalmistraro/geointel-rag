services:
  - type: web
    name: geointel-rag-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/download_from_hub.py
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false        # set manually in Render dashboard
      - key: HF_TOKEN
        sync: false        # needed only if dataset repo is private
